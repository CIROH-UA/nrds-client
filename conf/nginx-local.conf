# Local stand-in for the EC2 host nginx (see docker-compose.uvx.yml).
# The /static/ and /media/ blocks are the new part vs. today's EC2 config: the uvx image
# has no internal nginx, so the proxy in front must serve collected static itself.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;              # nginx-unprivileged cannot bind <1024; EC2 uses 80/443
    server_name _;

    client_max_body_size 100M;

    # Collected by provision.sh (collectstatic) into STATIC_ROOT on the persist mount.
    location /static/ {
        alias /home/tethys/persist/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /home/tethys/persist/media/;
    }

    location / {
        proxy_pass http://web:8000;    # EC2: http://127.0.0.1:8080
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ASGI / WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
