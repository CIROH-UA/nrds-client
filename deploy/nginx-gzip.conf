# Compression for the app bundle.
#
# The base image sets `gzip on` and leaves `gzip_types` commented out, so nginx falls back to
# its default of text/html only and the JavaScript bundle went over the wire uncompressed:
# 3.4 MB where gzip -6 gives 0.95 MB of the same bytes. That is the whole of this app's initial
# download, and no amount of code splitting recovers as much as turning the compressor on.
#
# Dropped into conf.d rather than edited into nginx.conf, which belongs to the base image and
# would need a sed that breaks the day upstream reformats the file. conf.d is included inside
# the http block, which is where these directives belong.
#
# Fonts, images and parquet are absent on purpose: they carry their own compression and gzipping
# them costs CPU to make them very slightly larger. Measured, because the parquet is the largest
# thing this app serves and the temptation to add it will recur: the 45.3 MB hydrofabric index
# gzips to 45.0 MB, 99% of raw. It is the remaining bottleneck on a cold load and compression is
# not the lever for it.

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
